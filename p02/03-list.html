<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.2 List</title>
</head>
<body>
<!-- Unordered: berpeluru, urutan tak penting -->
<ul>
    <li>Beras 5 kg</li>
    <li>Minyak goreng</li>
</ul>

<!-- Ordered: bernomor, urutan penting -->
<ol>
    <li>Didihkan air</li>
    <li>Masukkan mi, tunggu 3 menit</li>
    <li>Sajikan</li>
</ol>

<!-- Atribut ol -->
<ol start="5">      <!-- mulai dari 5 -->
    <li>Item lima</li>
    <li>Item enam</li>
</ol>
<ol type="a">       <!-- a b c (juga: i, A, 1) -->
    <li>Item a</li>
    <li>Item b</li>
</ol>
<ol reversed>       <!-- hitung mundur -->
    <li>Item tiga</li>
    <li>Item dua</li>
    <li>Item satu</li>
</ol>
</body>
</html>
