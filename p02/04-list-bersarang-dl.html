<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Bersarang dan Definition List</title>
</head>
<body>
<ul>
    <li>Buah
        <ul>
            <li>Apel</li>
            <li>Jeruk</li>
        </ul>
    </li>
    <li>Sayur</li>
</ul>

<!-- dl = pasangan istilah + definisi -->
<dl>
    <dt>HTML</dt>
    <dd>Bahasa markup struktur web.</dd>
    <dt>CSS</dt>
    <dd>Bahasa pengatur tampilan.</dd>
</dl>
</body>
</html>
