<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kutipan dan Kode</title>
</head>
<body>
<!-- Kutipan panjang: blok menjorok -->
<blockquote cite="https://id.wikipedia.org">
    "Bermimpilah setinggi langit; jika engkau
     jatuh, engkau jatuh di antara bintang."
</blockquote>

<!-- Kutipan pendek sebaris -->
<p>Soekarno berkata <q>Berikan aku 1000
   orang tua...</q></p>

<!-- Tampilkan kode apa adanya -->
<pre><code>&lt;h1&gt;Halo&lt;/h1&gt;
&lt;p&gt;ini kode&lt;/p&gt;</code></pre>
</body>
</html>
