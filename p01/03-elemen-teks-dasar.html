<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemen Teks Dasar</title>
</head>
<body>
    <!-- Heading: h1 terbesar → h6 terkecil -->
    <h1>Judul Utama</h1>
    <h2>Sub Judul</h2>
    <h3>Sub-sub Judul</h3>

    <!-- Paragraf -->
    <p>HTML mengabaikan baris baru
       dan spasi berlebih di kode.</p>

    <!-- Penegasan semantik -->
    <p>Teks <strong>penting</strong> dan
       <em>miring</em>.</p>

    <!-- Garis, baris baru, komentar -->
    <hr>
    <p>Baris satu<br>baris dua.</p>
    <!-- catatan: tak tampil di halaman -->
</body>
</html>
