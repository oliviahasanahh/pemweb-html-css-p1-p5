<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomi Elemen</title>
</head>
<body>
<!-- Satu ELEMEN = tag pembuka + konten + tag penutup -->
<h1>Halo</h1>
<!-- pembuka = <h1>, penutup = </h1> (ada garis miring /) -->

<!-- Atribut = info tambahan pada tag pembuka -->
<p class="info" id="intro">Teks</p>
<!-- atribut: class, id | nilai: "info", "intro" (SELALU dalam kutip) -->

<!-- Nested: tutup DARI DALAM ke LUAR -->
<p><strong>Benar</strong></p>
<!-- Salah (jangan ditulis): <p><strong>Salah </p></strong> -->
</body>
</html>
