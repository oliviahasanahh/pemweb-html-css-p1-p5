<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colspan dan rowspan</title>
</head>
<body>
<table border="1">
    <tr>
        <th rowspan="2">Nama</th>
        <th colspan="2">Kontak</th>
    </tr>
    <tr>
        <th>Email</th>
        <th>Telepon</th>
    </tr>
    <tr>
        <td>Andi</td>
        <td>andi@mail.com</td>
        <td>0812xxx</td>
    </tr>
</table>

<!-- colspan="n" → melebar n kolom ke kanan
     rowspan="n" → memanjang n baris ke bawah -->
</body>
</html>
